name: Verify Knowledge XLSX Fix

on:
  push:
    branches:
      - fix/knowledge-xlsx-upload-ui-prodweb-20260901
  workflow_dispatch:

jobs:
  verify-web:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-key

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Excel upload whitelist
        run: |
          node <<'NODE'
          const fs = require('fs');
          const source = fs.readFileSync(
            'apps/web/src/components/knowledge/KnowledgeLibrary.tsx',
            'utf8',
          );
          const match = source.match(/const allowedExtensions = \[([\s\S]*?)\];/);
          if (!match) throw new Error('allowedExtensions not found');
          const extensions = [...match[1].matchAll(/"([^\"]+)"/g)].map((m) => m[1]);
          const supports = (name) => {
            const lower = name.toLowerCase();
            return extensions.some((extension) => lower.endsWith(extension));
          };
          if (!supports('knowledge.xlsx')) throw new Error('.xlsx is still blocked');
          if (!supports('knowledge.xls')) throw new Error('.xls is still blocked');
          if (supports('knowledge.csv')) throw new Error('.csv unexpectedly allowed');
          if (!source.includes('accept=".pdf,.docx,.xlsx,.xls,.txt,.md,.markdown"')) {
            throw new Error('file input accept list does not include Excel');
          }
          console.log('Excel upload whitelist assertions passed');
          NODE

      - name: Lint changed web files
        run: npm run lint --workspace apps/web -- src/components/knowledge/KnowledgeLibrary.tsx tests/knowledge-upload.spec.ts

      - name: Build web
        run: npm run build --workspace apps/web
