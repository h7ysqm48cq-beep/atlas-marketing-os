name: temp-agent-gateway-verify

on:
  push:
    branches:
      - feat/agent-supervisor-runtime-gateway-20260901

permissions:
  contents: read

jobs:
  gateway-focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/atlas_ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify diff and Prisma scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin production/atlas:refs/remotes/origin/production/atlas
          git diff --check origin/production/atlas...HEAD
          echo '===== CHANGED FILES ====='
          git diff --name-status origin/production/atlas...HEAD
          if git diff --name-only origin/production/atlas...HEAD -- apps/api/prisma | grep -q .; then
            echo 'Unexpected Prisma change in runtime gateway increment' >&2
            exit 1
          fi

      - name: Run focused gateway tests
        run: npm test --workspace apps/api -- --runInBand src/agent-supervisor/gateway

      - name: Run full Supervisor regression
        run: npm test --workspace apps/api -- --runInBand src/agent-supervisor

      - name: Run related Engineering regression
        run: npm test --workspace apps/api -- --runInBand src/agent-supervisor src/engineering

      - name: Build API production path
        run: npm run build --workspace apps/api

      - name: Validate permanent Supervisor workflow
        shell: bash
        run: |
          set -euo pipefail
          ruby -e "require 'yaml'; data = YAML.load_file('.github/workflows/atlas-supervisor-gate.yml'); abort 'invalid YAML' unless data.is_a?(Hash)"
          node <<'NODE'
          const fs = require('node:fs');
          const text = fs.readFileSync('.github/workflows/atlas-supervisor-gate.yml', 'utf8');
          const required = [
            'name: atlas-supervisor-gate',
            'review-candidate',
            'explicitUserAuthorization: false',
            'changed_files_b64',
            '--fail-with-body',
            '--max-time 15',
            'secrets.' + 'ATLAS_SUPERVISOR_API_URL',
            'secrets.' + 'ATLAS_SUPERVISOR_CI_TOKEN',
          ];
          for (const fragment of required) {
            if (!text.includes(fragment)) throw new Error(`missing required gate fragment: ${fragment}`);
          }
          for (const forbidden of ['continue-on-error', '/gateway/check-integration']) {
            if (text.includes(forbidden)) throw new Error(`unsafe gate fragment present: ${forbidden}`);
          }
          console.log('permanent Supervisor workflow static checks passed');
          NODE
