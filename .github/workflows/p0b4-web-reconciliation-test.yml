name: P0B4 Web Reconciliation Test

on:
  push:
    branches:
      - reconcile/web-live-fixes-20260903

jobs:
  verify-web-reconciliation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Deterministic Web regression tests
        run: node --test apps/web/tests/*.spec.cjs
      - name: Focused lint
        run: npm run lint --workspace apps/web -- src/proxy.ts src/app/login/page.tsx src/components/UserMenu.tsx src/components/knowledge/KnowledgeLibrary.tsx
      - name: Web production build
        run: npm run build --workspace apps/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-key
