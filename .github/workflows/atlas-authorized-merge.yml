name: atlas-authorized-merge

"on":
  workflow_run:
    workflows: [atlas-supervisor-gate]
    types: [completed]
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: "Merged governed PR number requiring trusted attestation recovery"
        required: true
        type: string

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  authorized-merge:
    name: atlas-authorized-merge
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Revalidate trusted upstream run and execute exact authorized merge
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RECOVERY_PR_NUMBER: ${{ github.event.inputs.pull_request_number }}
          SUPERVISOR_API_URL: ${{ secrets.ATLAS_SUPERVISOR_API_URL }}
          SUPERVISOR_CI_TOKEN: ${{ secrets.ATLAS_SUPERVISOR_CI_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const {
            GITHUB_TOKEN,
            REPOSITORY,
            EVENT_NAME,
            RUN_ID,
            HEAD_SHA: WORKFLOW_HEAD_SHA,
            RECOVERY_PR_NUMBER,
            SUPERVISOR_API_URL,
            SUPERVISOR_CI_TOKEN,
          } = process.env;

          for (const [key, value] of Object.entries({
            GITHUB_TOKEN,
            REPOSITORY,
            EVENT_NAME,
            SUPERVISOR_API_URL,
            SUPERVISOR_CI_TOKEN,
          })) {
            if (!value) throw new Error(`${key} is missing`);
          }
          if (!['workflow_run', 'workflow_dispatch'].includes(EVENT_NAME)) {
            throw new Error('unsupported trusted merge event');
          }

          const githubHeaders = {
            Accept: 'application/vnd.github+json',
            Authorization: `Bearer ${GITHUB_TOKEN}`,
            'X-GitHub-Api-Version': '2022-11-28',
          };
          let mergeFailureContext = null;

          async function github(path, options = {}) {
            const response = await fetch(
              `https://api.github.com/repos/${REPOSITORY}${path}`,
              {
                ...options,
                headers: {
                  ...githubHeaders,
                  ...(options.headers ?? {}),
                },
              },
            );
            const text = await response.text();
            let body = null;
            if (text) {
              try { body = JSON.parse(text); } catch { body = text; }
            }
            if (!response.ok) {
              throw new Error(`GitHub request failed ${response.status}: ${typeof body === 'string' ? body : JSON.stringify(body)}`);
            }
            return body;
          }

          async function githubGraphql(query, variables) {
            const response = await fetch('https://api.github.com/graphql', {
              method: 'POST',
              headers: {
                ...githubHeaders,
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({ query, variables }),
            });
            const text = await response.text();
            let body = null;
            if (text) {
              try { body = JSON.parse(text); } catch { body = text; }
            }
            if (!response.ok || body?.errors?.length) {
              throw new Error(
                `GitHub GraphQL request failed ${response.status}: ${typeof body === 'string' ? body : JSON.stringify(body)}`,
              );
            }
            return body?.data;
          }

          async function redraftOpenCandidateAfterFailure() {
            if (EVENT_NAME !== 'workflow_run') return;
            const context = mergeFailureContext;
            if (!context) return;

            const current = await github(`/pulls/${context.prNumber}`);
            if (
              current?.state !== 'open' ||
              current?.merged === true ||
              current?.draft === true ||
              current?.head?.sha !== context.headSha ||
              current?.base?.ref !== context.baseRef ||
              current?.base?.sha !== context.baseSha ||
              typeof current?.node_id !== 'string' ||
              !current.node_id
            ) {
              return;
            }

            const result = await githubGraphql(
              `mutation($pullRequestId: ID!) {
                convertPullRequestToDraft(input: { pullRequestId: $pullRequestId }) {
                  pullRequest {
                    id
                    isDraft
                  }
                }
              }`,
              { pullRequestId: current.node_id },
            );
            if (result?.convertPullRequestToDraft?.pullRequest?.isDraft !== true) {
              throw new Error('fail-closed redraft was not confirmed');
            }
            console.error(
              `Fail-closed: returned PR #${context.prNumber} to draft after trusted merge failure.`,
            );
          }

          async function supervisor(path, body, options = {}) {
            const response = await fetch(
              `${SUPERVISOR_API_URL.replace(/\/$/, '')}${path}`,
              {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'X-Atlas-Supervisor-CI-Token': SUPERVISOR_CI_TOKEN,
                },
                body: JSON.stringify(body),
              },
            );
            const text = await response.text();
            let parsed = null;
            if (text) {
              try { parsed = JSON.parse(text); } catch { parsed = text; }
            }
            if (!response.ok) {
              if (
                options.allowAlreadyConsumed === true &&
                response.status === 400 &&
                parsed?.code === 'owner_merge_authorization_already_consumed'
              ) {
                return { alreadyConsumed: true };
              }
              throw new Error(`Supervisor request failed ${response.status}: ${typeof parsed === 'string' ? parsed : JSON.stringify(parsed)}`);
            }
            return parsed;
          }

          function requireMetadata(body, label, pattern) {
            const match = String(body ?? '').match(pattern);
            if (!match?.[1]) throw new Error(`missing ${label} metadata`);
            return match[1];
          }

          async function qualifyAffectedWorkers(changedFiles, mergeCommitSha) {
            const exact = (path, value) => path === value;
            const under = (path, prefix) => path.startsWith(prefix);
            const runnerAffected = changedFiles.some((path) =>
              under(path, 'apps/engineering-runner/') ||
              exact(path, 'apps/api/scripts/check-production-deployment-gate.cjs') ||
              exact(path, 'package.json') ||
              exact(path, 'package-lock.json') ||
              under(path, 'tools/ai_engineer/') ||
              under(path, 'tools/runtime/') ||
              under(path, 'tools/modifier/'),
            );
            const verifierAffected = changedFiles.some((path) =>
              under(path, 'apps/engineering-runner/') ||
              exact(path, 'apps/api/scripts/check-production-deployment-gate.cjs') ||
              exact(path, 'package.json') ||
              exact(path, 'package-lock.json') ||
              under(path, 'tools/ai_engineer/'),
            );
            const services = [];
            if (runnerAffected) services.push('engineering-runner');
            if (verifierAffected) services.push('engineering-verifier');
            if (services.length === 0) return;

            const [repositoryOwner, repositoryName] = REPOSITORY.split('/');
            if (!repositoryOwner || !repositoryName) {
              throw new Error('invalid GitHub repository identity');
            }

            for (const service of services) {
              for (let attempt = 1; attempt <= 60; attempt += 1) {
                const result = await supervisor(
                  '/engineering/supervisor/gateway/production-deployment/qualification',
                  {
                    service,
                    github: {
                      repositoryOwner,
                      repositoryName,
                      branch: 'production/atlas',
                      commitSha: mergeCommitSha,
                    },
                  },
                );
                if (
                  result?.service !== service ||
                  result?.commitSha !== mergeCommitSha ||
                  typeof result?.taskId !== 'string' ||
                  typeof result?.executionId !== 'string'
                ) {
                  throw new Error(`${service} qualification returned mismatched identity`);
                }
                if (
                  result.taskStatus === 'READY_FOR_REVIEW' ||
                  result.taskStatus === 'APPROVED'
                ) {
                  console.log('ATLAS_DEPLOY_QUALIFICATION_READY', {
                    service,
                    taskId: result.taskId,
                    executionId: result.executionId,
                    commitSha: result.commitSha,
                  });
                  break;
                }
                if (result.executionStatus === 'FAILED') {
                  throw new Error(`${service} independent verifier failed`);
                }
                if (attempt === 60) {
                  throw new Error(`${service} qualification did not reach READY_FOR_REVIEW in time`);
                }
                await new Promise((resolve) => setTimeout(resolve, 2_000));
              }
            }
          }

          async function main() {
            let HEAD_SHA;
            let PR_NUMBER;
            let pr;

            if (EVENT_NAME === 'workflow_run') {
              if (!/^\d+$/.test(RUN_ID ?? '')) throw new Error('invalid workflow run id');
              if (!/^[0-9a-f]{40}$/i.test(WORKFLOW_HEAD_SHA ?? '')) {
                throw new Error('invalid workflow head sha');
              }
              HEAD_SHA = WORKFLOW_HEAD_SHA;

              const run = await github(`/actions/runs/${RUN_ID}`);
              if (
                Number(run?.id) !== Number(RUN_ID) ||
                run?.name !== 'atlas-supervisor-gate' ||
                run?.path !== '.github/workflows/atlas-supervisor-gate.yml' ||
                run?.event !== 'pull_request' ||
                run?.conclusion !== 'success' ||
                run?.repository?.full_name !== REPOSITORY ||
                run?.head_repository?.full_name !== REPOSITORY ||
                run?.head_sha !== HEAD_SHA
              ) {
                throw new Error('upstream workflow identity is not trusted');
              }

              const jobsResponse = await github(
                `/actions/runs/${RUN_ID}/jobs?per_page=100&filter=latest`,
              );
              const jobs = Array.isArray(jobsResponse?.jobs) ? jobsResponse.jobs : [];
              const gates = jobs.filter((job) => job?.name === 'atlas-supervisor-gate');
              const apiChecks = jobs.filter((job) => job?.name === 'api-verification');
              if (gates.length !== 1 || gates[0]?.conclusion !== 'success') {
                throw new Error('upstream Supervisor gate is not uniquely successful');
              }
              if (apiChecks.length === 1 && apiChecks[0]?.conclusion === 'skipped') {
                console.log('Closed-event upstream run detected; authorized merge executor is a no-op.');
                return;
              }
              if (apiChecks.length !== 1 || apiChecks[0]?.conclusion !== 'success') {
                throw new Error('upstream API verification is not uniquely successful');
              }

              const associated = await github(`/commits/${HEAD_SHA}/pulls`);
              const governed = (Array.isArray(associated) ? associated : []).filter((candidate) =>
                candidate?.head?.sha === HEAD_SHA &&
                candidate?.head?.repo?.full_name === REPOSITORY &&
                ['production/atlas', 'main'].includes(candidate?.base?.ref) &&
                (candidate?.state === 'open' || candidate?.merged_at != null),
              );
              if (governed.length !== 1) {
                throw new Error(`expected exactly one governed pull request, found ${governed.length}`);
              }
              PR_NUMBER = String(governed[0].number);
              pr = await github(`/pulls/${PR_NUMBER}`);
            } else if (EVENT_NAME === 'workflow_dispatch') {
              if (!/^\d+$/.test(RECOVERY_PR_NUMBER ?? '')) {
                throw new Error('invalid recovery pull request number');
              }
              PR_NUMBER = RECOVERY_PR_NUMBER;
              pr = await github(`/pulls/${PR_NUMBER}`);
              HEAD_SHA = pr?.head?.sha;
              if (!/^[0-9a-f]{40}$/i.test(HEAD_SHA ?? '')) {
                throw new Error('invalid recovery pull request head sha');
              }
            } else {
              throw new Error('unsupported trusted merge event');
            }

            const isOpenCandidate =
              pr?.state === 'open' &&
              pr?.merged !== true &&
              pr?.merged_at == null &&
              pr?.draft !== true;
            const isMergedCandidate =
              pr?.state === 'closed' &&
              pr?.merged === true &&
              typeof pr?.merged_at === 'string' &&
              Boolean(pr.merged_at) &&
              /^[0-9a-f]{40}$/i.test(pr?.merge_commit_sha ?? '');

            if (EVENT_NAME === 'workflow_dispatch' && isOpenCandidate) {
              throw new Error('manual recovery cannot execute a new merge');
            }
            if (EVENT_NAME === 'workflow_dispatch' && !isMergedCandidate) {
              throw new Error('manual recovery requires an already merged governed pull request');
            }
            if (!isOpenCandidate && !isMergedCandidate) {
              throw new Error('pull request is neither an eligible open candidate nor an exact merged candidate');
            }
            if (
              pr?.head?.sha !== HEAD_SHA ||
              pr?.head?.repo?.full_name !== REPOSITORY ||
              !['production/atlas', 'main'].includes(pr?.base?.ref) ||
              !/^[0-9a-f]{40}$/i.test(pr?.base?.sha ?? '')
            ) {
              throw new Error('pull request identity drifted or is not governed');
            }

            if (EVENT_NAME === 'workflow_run' && isOpenCandidate) {
              mergeFailureContext = {
                prNumber: PR_NUMBER,
                headSha: HEAD_SHA,
                baseRef: pr.base.ref,
                baseSha: pr.base.sha,
              };
            }

            const TASK_ID = requireMetadata(
              pr.body,
              'Supervisor task',
              /^ATLAS-SUPERVISOR-TASK:\s*(ATLAS-[A-Za-z0-9-]+)\s*$/m,
            );
            const EXECUTION_ID = requireMetadata(
              pr.body,
              'Supervisor execution',
              /^ATLAS-SUPERVISOR-EXECUTION:\s*(ATLAS-EXEC-[A-Za-z0-9-]+)\s*$/m,
            );

            const changedFiles = [];
            for (let page = 1; ; page += 1) {
              const batch = await github(
                `/pulls/${PR_NUMBER}/files?per_page=100&page=${page}`,
              );
              if (!Array.isArray(batch)) throw new Error('invalid changed-files response');
              changedFiles.push(...batch.map((entry) => entry?.filename));
              if (batch.length < 100) break;
            }
            if (
              changedFiles.length === 0 ||
              changedFiles.some((path) => typeof path !== 'string' || !path)
            ) {
              throw new Error('invalid empty or malformed changed-file set');
            }
            const normalizedFiles = [...new Set(changedFiles)].sort();

            let merged;
            let mergeCommitSha;

            if (isOpenCandidate) {
              const review = await supervisor(
                '/engineering/supervisor/gateway/review-candidate',
                {
                  taskId: TASK_ID,
                  executionId: EXECUTION_ID,
                  action: 'merge',
                  targetBranch: pr.base.ref,
                  baseSha: pr.base.sha,
                  headSha: HEAD_SHA,
                  changedFiles: normalizedFiles,
                  explicitUserAuthorization: false,
                },
              );
              if (
                review?.allowed !== true ||
                review?.taskId !== TASK_ID ||
                review?.executionId !== EXECUTION_ID
              ) {
                throw new Error('fresh signed Owner merge authorization is not valid for the exact candidate');
              }

              const response = await github(
                `/pulls/${PR_NUMBER}/merge`,
                {
                  method: 'PUT',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({
                    merge_method: 'merge',
                    sha: HEAD_SHA,
                  }),
                },
              );
              if (response?.merged !== true || !/^[0-9a-f]{40}$/i.test(response?.sha ?? '')) {
                throw new Error(`GitHub normal merge was not confirmed: ${JSON.stringify(response)}`);
              }
              mergeCommitSha = response.sha;
              merged = await github(`/pulls/${PR_NUMBER}`);
            }

            if (isMergedCandidate) {
              mergeCommitSha = pr.merge_commit_sha;
              merged = pr;
            }

            if (
              merged?.state !== 'closed' ||
              merged?.merged !== true ||
              merged?.merge_commit_sha !== mergeCommitSha ||
              merged?.head?.sha !== HEAD_SHA ||
              merged?.base?.ref !== pr.base.ref ||
              merged?.base?.sha !== pr.base.sha ||
              typeof merged?.merged_at !== 'string' ||
              !merged.merged_at
            ) {
              throw new Error('merged pull request identity does not match the authorized candidate');
            }

            const mergeCommit = await github(`/commits/${mergeCommitSha}`);
            if (
              mergeCommit?.sha !== mergeCommitSha ||
              mergeCommit?.parents?.length !== 2 ||
              mergeCommit.parents[0]?.sha !== pr.base.sha ||
              mergeCommit.parents[1]?.sha !== HEAD_SHA
            ) {
              throw new Error('merge commit parents do not match the authorized exact candidate');
            }

            const consumption = await supervisor(
              '/engineering/supervisor/gateway/merge-authorization/consume',
              {
                taskId: TASK_ID,
                executionId: EXECUTION_ID,
                action: 'merge',
                targetBranch: pr.base.ref,
                baseSha: pr.base.sha,
                headSha: HEAD_SHA,
                changedFiles: normalizedFiles,
                attestation: {
                  pullRequestNumber: Number(PR_NUMBER),
                  mergeCommitSha,
                  mergeParents: [pr.base.sha, HEAD_SHA],
                  mergedAt: merged.merged_at,
                },
              },
              { allowAlreadyConsumed: isMergedCandidate },
            );

            if (consumption?.alreadyConsumed === true) {
              console.log(
                `Trusted exact merged candidate already has a consumed authorization receipt for PR #${PR_NUMBER}.`,
              );
            } else if (
              consumption?.allowed !== true ||
              consumption?.taskId !== TASK_ID ||
              consumption?.executionId !== EXECUTION_ID
            ) {
              throw new Error('trusted merge attestation consumption was not confirmed');
            }

            if (pr.base.ref === 'production/atlas') {
              await qualifyAffectedWorkers(normalizedFiles, mergeCommitSha);
            }

            if (isMergedCandidate) {
              console.log(
                `Trusted exact merge recovery consumption confirmed for PR #${PR_NUMBER} ` +
                `at ${mergeCommitSha}.`,
              );
              return;
            }

            console.log(
              `Trusted exact merge and attestation consumption confirmed for PR #${PR_NUMBER} ` +
              `at ${mergeCommitSha}.`,
            );
          }

          main().catch(async (error) => {
            console.error(error?.message ?? 'trusted authorized merge failed');
            try {
              await redraftOpenCandidateAfterFailure();
            } catch (redraftError) {
              console.error(
                redraftError?.message ?? 'fail-closed redraft after trusted merge failure failed',
              );
            }
            process.exitCode = 1;
          });
          NODE
