name: tmp-supervisor-owner-guard-verify

on:
  push:
    branches:
      - feat/supervisor-owner-mutation-guard-20260901

permissions:
  contents: read

jobs:
  combined:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:unused@127.0.0.1:59999/unused
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema apps/api/prisma/schema.prisma
      - name: Owner guard focused tests
        run: npm run test --workspace apps/api -- agent-supervisor/gateway/supervisor-owner.guard.spec.ts agent-supervisor/agent-supervisor.controller.spec.ts agent-supervisor/agent-supervisor.module.spec.ts --runInBand
      - name: Full Supervisor regression
        run: npm run test --workspace apps/api -- agent-supervisor --runInBand
      - name: API production build
        run: npm run build --workspace apps/api
      - name: Credential separation and diff safety
        shell: bash
        run: |
          set -euo pipefail
          git diff --check origin/production/atlas...HEAD
          test -z "$(git diff --name-only origin/production/atlas...HEAD -- apps/api/prisma/schema.prisma apps/api/prisma/migrations)"
          ! grep -q 'ATLAS_SUPERVISOR_OWNER_TOKEN' .github/workflows/atlas-supervisor-gate.yml
          ! grep -qi 'x-atlas-supervisor-owner-token' .github/workflows/atlas-supervisor-gate.yml
          ! grep -q 'explicitUserApproval' apps/api/src/agent-supervisor/agent-supervisor.controller.ts
