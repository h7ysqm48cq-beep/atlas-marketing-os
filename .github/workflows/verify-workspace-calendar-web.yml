name: Verify Workspace Calendar Web Fix

on:
  pull_request:
    branches:
      - ci/workspace-calendar-web-verify-base-20260901

permissions:
  contents: write

jobs:
  patch-and-verify-web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8080
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      BROWSER_VIEWER_TOKEN_SECRET: ci-placeholder
      OPENAI_MODEL: gpt-5.6-luna
    steps:
      - name: Checkout isolated Web fix branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Verify Calendar patch is present
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('apps/web/src/components/calendar/ContentCalendar.tsx')
          text = path.read_text()
          required = [
              'const scheduledTimeIsPast =',
              'min={minimumScheduledAt}',
              'No available channel for this brand.',
              'scheduledTime.getTime() <= Date.now()',
          ]
          missing = [marker for marker in required if marker not in text]
          if missing:
              raise SystemExit(f'Missing expected Calendar patch markers: {missing}')
          print('Calendar patch markers verified.')
          PY

          git diff --check ci/workspace-calendar-web-verify-base-20260901...HEAD -- apps/web/src/components/calendar/ContentCalendar.tsx

      - name: Install
        run: npm ci

      - name: Calendar file lint
        run: npx eslint apps/web/src/components/calendar/ContentCalendar.tsx

      - name: Web build
        run: npm run build --workspace apps/web
