name: Verify Engineering Copilot Patch Integrity

# Branch-only verification; this workflow never deploys.
on:
  push:
    branches:
      - fix/engineering-copilot-patch-integrity-20260902
    paths:
      - "apps/api/prisma/**"
      - "apps/api/src/engineering/**"
      - "apps/web/src/components/engineering/**"
      - "apps/web/tests/engineering-patch-integrity.spec.mjs"
      - "tools/ai_engineer/**"
      - "tools/tests/test_repository_reasoner_stop_words.py"
      - ".github/workflows/verify-engineering-copilot-patch-integrity.yml"

permissions:
  contents: write

jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:unused@127.0.0.1:59999/unused

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply proposal-bound Web GREEN once
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("apps/web/src/components/engineering/EngineeringCopilot.tsx")
          source = path.read_text()

          if (
              "/engineering/apply/proposal" in source
              and "/engineering/apply/batch" not in source
              and "const [proposal, setProposal]" in source
          ):
              print("Proposal-bound Web GREEN already applied.")
              raise SystemExit(0)

          def replace_once(old: str, new: str, label: str) -> None:
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 exact match, found {count}")
              source = source.replace(old, new, 1)

          replace_once(
              '''  const [decision, setDecision] =\n    useState<\n      "pending" |\n      "approved" |\n      "rejected"\n    >("pending");\n\n  const [message, setMessage] =\n''',
              '''  const [decision, setDecision] =\n    useState<\n      "pending" |\n      "approved" |\n      "rejected"\n    >("pending");\n\n  const [proposal, setProposal] =\n    useState<{\n      id: string;\n      revision: number;\n      status: string;\n    } | null>(null);\n\n  const [message, setMessage] =\n''',
              "proposal state",
          )

          replace_once(
              '''  const hasExecutablePatch =\n    Boolean(\n      plan?.executable &&\n      runtimeView.patches?.some(\n''',
              '''  const hasExecutablePatch =\n    Boolean(\n      plan?.executable &&\n      proposal &&\n      runtimeView.patches?.some(\n''',
              "proposal execution gate",
          )

          replace_once(
              '''    setDecision("pending");\n    setAnalysis(null);\n    setLastPrompt(cleanText);\n''',
              '''    setDecision("pending");\n    setAnalysis(null);\n    setProposal(null);\n    setLastPrompt(cleanText);\n''',
              "analysis reset",
          )

          old_patch = '''            runtime.patches =\n              Array.isArray(patchData.patches)\n                ? patchData.patches.filter(\n                    (patch: {\n                      before?: string;\n                      after?: string;\n                    }) =>\n                      patch.before !== patch.after,\n                  )\n                : [];\n\n          }\n'''
          new_patch = '''            runtime.patches =\n              Array.isArray(patchData.patches)\n                ? patchData.patches.filter(\n                    (patch: {\n                      before?: string;\n                      after?: string;\n                    }) =>\n                      patch.before !== patch.after,\n                  )\n                : [];\n\n            const persistedProposal =\n              patchData.proposal &&\n              typeof patchData.proposal.id === "string" &&\n              Number.isInteger(patchData.proposal.revision)\n                ? {\n                    id: patchData.proposal.id as string,\n                    revision: patchData.proposal.revision as number,\n                    status:\n                      typeof patchData.proposal.status === "string"\n                        ? patchData.proposal.status\n                        : "READY_FOR_REVIEW",\n                  }\n                : null;\n\n            setProposal(persistedProposal);\n\n            runtime.diffPreviews =\n              runtime.patches\n                .slice(0, 3)\n                .map((patch) => ({\n                  filePath: patch.filePath,\n                  lines: [\n                    {\n                      type: "remove" as const,\n                      text: patch.before || "",\n                    },\n                    {\n                      type: "add" as const,\n                      text: patch.after || "",\n                    },\n                  ],\n                }));\n\n          }\n'''
          replace_once(old_patch, new_patch, "persist proposal response")

          replace_once(
              '''        } catch {\n\n          runtime.patches = [];\n\n        }\n''',
              '''        } catch {\n\n          runtime.patches = [];\n          runtime.diffPreviews = [];\n          setProposal(null);\n\n        }\n''',
              "patch failure reset",
          )

          recovery_pattern = re.compile(
              r'''  async function handleRecoveryApply\(.*?\n\n  async function handlePipelineAction\(''',
              re.DOTALL,
          )
          recovery_replacement = '''  async function handleRecoveryApply(\n    patches:\n      {\n        filePath: string;\n        before?: string;\n        after?: string;\n      }[] | undefined,\n  ) {\n    if (!patches?.length) {\n      setMessage(\n        "No recovery patch available.",\n      );\n      return;\n    }\n\n    setMessage(\n      "Recovery patches are review-only until they are persisted as an immutable proposal.",\n    );\n  }\n\n\n  async function handlePipelineAction('''
          source, count = recovery_pattern.subn(
              recovery_replacement,
              source,
              count=1,
          )
          if count != 1:
              raise SystemExit(f"recovery fail-closed: expected 1 block, found {count}")

          approve_pattern = re.compile(
              r'''    if \(actionId === "approve"\) \{.*?\n    if \(actionId === "apply"\) \{''',
              re.DOTALL,
          )
          approve_replacement = '''    if (actionId === "approve") {\n      if (!hasExecutablePatch || !proposal) {\n        setMessage(\n          "No persisted executable patch proposal is available for approval.",\n        );\n        return;\n      }\n\n      setBusy(true);\n      try {\n        const response = await fetch(\n          `${API_URL}/engineering/patch/proposal/approve`,\n          {\n            method: "POST",\n            headers: {\n              "Content-Type": "application/json",\n            },\n            body: JSON.stringify({\n              proposalId: proposal.id,\n              revision: proposal.revision,\n            }),\n          },\n        );\n\n        if (!response.ok) {\n          throw new Error(\n            "Failed to approve the reviewed patch proposal.",\n          );\n        }\n\n        const approved = await response.json() as {\n          status?: string;\n        };\n\n        setProposal({\n          ...proposal,\n          status: approved.status || "APPROVED",\n        });\n        setDecision("approved");\n        setRuntimeView({\n          ...runtimeView,\n          approvalState: "APPROVED",\n        });\n        setMessage(\n          "Patch proposal approved. Ready to apply the reviewed revision.",\n        );\n      } catch (error) {\n        setMessage(\n          error instanceof Error\n            ? error.message\n            : "Patch proposal approval failed.",\n        );\n      } finally {\n        setBusy(false);\n      }\n\n      return;\n    }\n\n\n    if (actionId === "apply") {'''
          source, count = approve_pattern.subn(
              approve_replacement,
              source,
              count=1,
          )
          if count != 1:
              raise SystemExit(f"approve proposal binding: expected 1 block, found {count}")

          apply_pattern = re.compile(
              r'''    if \(actionId === "apply"\) \{.*?\n    if \(actionId === "reject"\) \{''',
              re.DOTALL,
          )
          apply_replacement = '''    if (actionId === "apply") {\n      if (!hasExecutablePatch || !proposal) {\n        setMessage(\n          "No persisted executable patch proposal is available to apply.",\n        );\n        return;\n      }\n\n      if (decision !== "approved") {\n        setMessage(\n          "Approve the exact reviewed proposal revision before applying it.",\n        );\n        return;\n      }\n\n      setRuntimeView({\n        ...runtimeView,\n        applyStatus: "applying",\n        statusMessage: "Applying reviewed repository proposal...",\n      });\n\n      try {\n        const response = await fetch(\n          `${API_URL}/engineering/apply/proposal`,\n          {\n            method: "POST",\n            headers: {\n              "Content-Type": "application/json",\n            },\n            body: JSON.stringify({\n              proposalId: proposal.id,\n              revision: proposal.revision,\n            }),\n          },\n        );\n\n        if (!response.ok) {\n          throw new Error(\n            "Failed applying the reviewed repository proposal.",\n          );\n        }\n\n        const applyResult = await response.json() as {\n          proposalStatus?: string;\n        };\n\n        setProposal({\n          ...proposal,\n          status: applyResult.proposalStatus || "APPLIED",\n        });\n\n        const validationResponse =\n          await fetch(\n            `${API_URL}/engineering/validation/typescript`,\n            { method: "POST" },\n          );\n\n        const validation =\n          await validationResponse.json();\n\n        const auditResponse =\n          await fetch(\n            `${API_URL}/engineering/audit`,\n          );\n\n        const auditRecords =\n          await auditResponse.json();\n\n        let recovery = null;\n\n        if (validation.status !== "passed") {\n          const recoveryResponse =\n            await fetch(\n              `${API_URL}/engineering/recovery/analyze`,\n              {\n                method: "POST",\n                headers: {\n                  "Content-Type": "application/json",\n                },\n                body: JSON.stringify({\n                  error: JSON.stringify(\n                    validation,\n                    auditRecords,\n                  ),\n                }),\n              },\n            );\n\n          if (recoveryResponse.ok) {\n            recovery = await recoveryResponse.json();\n          }\n        }\n\n        setRuntimeView({\n          ...runtimeView,\n          applyStatus:\n            validation.status === "passed"\n              ? "completed"\n              : "failed",\n          validation,\n          recovery,\n          statusMessage:\n            validation.status === "passed"\n              ? "Reviewed repository proposal validated successfully."\n              : "Repository validation failed after proposal apply.",\n        });\n\n        setMessage(\n          validation.status === "passed"\n            ? "Reviewed changes applied and validated successfully."\n            : "Reviewed changes applied but validation failed.",\n        );\n      } catch (error) {\n        setRuntimeView({\n          ...runtimeView,\n          applyStatus: "failed",\n          statusMessage:\n            error instanceof Error\n              ? error.message\n              : "Apply failed.",\n        });\n        setMessage(\n          "Repository proposal apply failed.",\n        );\n      }\n\n      return;\n    }\n\n    if (actionId === "reject") {'''
          source, count = apply_pattern.subn(
              apply_replacement,
              source,
              count=1,
          )
          if count != 1:
              raise SystemExit(f"apply proposal binding: expected 1 block, found {count}")

          reject_pattern = re.compile(
              r'''    if \(actionId === "reject"\) \{.*?\n    if \(\n      actionId === "retry"''',
              re.DOTALL,
          )
          reject_replacement = '''    if (actionId === "reject") {\n      if (proposal) {\n        const response = await fetch(\n          `${API_URL}/engineering/patch/proposal/reject`,\n          {\n            method: "POST",\n            headers: {\n              "Content-Type": "application/json",\n            },\n            body: JSON.stringify({\n              proposalId: proposal.id,\n              revision: proposal.revision,\n            }),\n          },\n        );\n\n        if (!response.ok) {\n          setMessage(\n            "Failed to reject the reviewed patch proposal.",\n          );\n          return;\n        }\n\n        setProposal({\n          ...proposal,\n          status: "REJECTED",\n        });\n      }\n\n      setDecision("rejected");\n      setMessage(\n        "Plan rejected. No files were modified.",\n      );\n      return;\n    }\n\n    if (\n      actionId === "retry"'''
          source, count = reject_pattern.subn(
              reject_replacement,
              source,
              count=1,
          )
          if count != 1:
              raise SystemExit(f"reject proposal binding: expected 1 block, found {count}")

          replace_once(
              '''    setAnalysis(null);\n    setRuntimeView(\n      IDLE_RUNTIME,\n    );\n    setDecision("pending");\n''',
              '''    setAnalysis(null);\n    setProposal(null);\n    setRuntimeView(\n      IDLE_RUNTIME,\n    );\n    setDecision("pending");\n''',
              "workspace reset",
          )

          if "/engineering/apply/batch" in source:
              raise SystemExit("raw batch apply remains after proposal binding")
          if "/engineering/apply/proposal" not in source:
              raise SystemExit("proposal apply route missing after binding")

          path.write_text(source)
          PY

          if git diff --quiet -- apps/web/src/components/engineering/EngineeringCopilot.tsx; then
            echo "No Web source commit required."
            exit 0
          fi

          git diff --check -- apps/web/src/components/engineering/EngineeringCopilot.tsx
          git config user.name "ATLAS CI"
          git config user.email "atlas-ci@users.noreply.github.com"
          git add apps/web/src/components/engineering/EngineeringCopilot.tsx
          git commit -m "fix(engineering): bind web apply to reviewed proposal"
          git push origin HEAD:fix/engineering-copilot-patch-integrity-20260902

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Install Python test dependency
        run: python -m pip install pytest

      - name: Generate Prisma client
        run: npx prisma generate --config prisma.config.ts

      - name: Run repository scanner regression
        run: >-
          npm test --workspace apps/api --
          --runInBand
          --runTestsByPath
          src/engineering/repository/repository.scanner.spec.ts

      - name: Run patch no-op regression
        run: >-
          npm test --workspace apps/api --
          --runInBand
          --runTestsByPath
          src/engineering/patch/patch.service.integrity.spec.ts

      - name: Run persisted proposal contract regression
        run: >-
          npm test --workspace apps/api --
          --runInBand
          --runTestsByPath
          src/engineering/patch/patch-proposal.contract.spec.ts

      - name: Run repository reasoner regressions
        run: python -m pytest -q tools/tests/test_repository_reasoner_stop_words.py

      - name: Run Engineering Copilot patch integrity regression
        run: node apps/web/tests/engineering-patch-integrity.spec.mjs

      - name: Run full API test suite
        run: npm test --workspace apps/api -- --runInBand

      - name: Build API
        run: npm run build --workspace apps/api

      - name: Build Web
        run: npm run build --workspace apps/web
