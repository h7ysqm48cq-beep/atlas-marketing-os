name: Verify Engineering Copilot Patch Integrity

on:
  push:
    branches:
      - fix/engineering-copilot-patch-integrity-20260902
    paths:
      - "apps/api/src/engineering/**"
      - "apps/web/src/components/engineering/**"
      - "apps/web/tests/engineering-patch-integrity.spec.mjs"
      - "tools/ai_engineer/**"
      - "tools/tests/test_repository_reasoner_stop_words.py"
      - ".github/workflows/verify-engineering-copilot-patch-integrity.yml"

permissions:
  contents: write

jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:unused@127.0.0.1:59999/unused

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply reasoner artifact policy once
        if: ${{ github.event.head_commit.message == 'ci(engineering): apply reasoner artifact policy once' }}
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tools/ai_engineer/repository_reasoner.py")
          text = path.read_text(encoding="utf-8")
          old = '''    @staticmethod
              def _ignored(
                  path: Path,
              ) -> bool:
                  ignored = {
                      ".git",
                      ".next",
                      ".turbo",
                      ".atlas",
                      "node_modules",
                      "dist",
                      "build",
                      "coverage",
                      "__pycache__",
                  }

                  return any(
                      part in ignored
                      for part in path.parts
                  )'''.replace("              ", "    ")
          new = '''    @staticmethod
              def _ignored(
                  path: Path,
              ) -> bool:
                  ignored = {
                      ".git",
                      ".next",
                      ".turbo",
                      ".atlas",
                      ".atlas-backups",
                      "node_modules",
                      "dist",
                      "build",
                      "coverage",
                      "__pycache__",
                  }

                  hidden_backup = re.compile(
                      r"^\\..+-backup-\\d{8}(?:-\\d{6})?$"
                  )

                  return any(
                      part in ignored
                      or hidden_backup.fullmatch(part)
                      for part in path.parts
                  )'''.replace("              ", "    ")

          if text.count(old) != 1:
              raise SystemExit("reasoner _ignored exact source block mismatch")

          path.write_text(
              text.replace(old, new, 1),
              encoding="utf-8",
          )
          PY

          git config user.name "atlas-integrity-ci"
          git config user.email "atlas-integrity-ci@users.noreply.github.com"
          git add tools/ai_engineer/repository_reasoner.py
          git commit -m "fix(engineering): ignore backup artifacts in reasoner"
          git push origin HEAD:fix/engineering-copilot-patch-integrity-20260902

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Install Python test dependency
        run: python -m pip install pytest

      - name: Generate Prisma client
        run: npx prisma generate --config prisma.config.ts

      - name: Run repository scanner regression
        run: >-
          npm test --workspace apps/api --
          --runInBand
          --runTestsByPath
          src/engineering/repository/repository.scanner.spec.ts

      - name: Run patch no-op regression
        run: >-
          npm test --workspace apps/api --
          --runInBand
          --runTestsByPath
          src/engineering/patch/patch.service.integrity.spec.ts

      - name: Run repository reasoner stop-word regression
        run: python -m pytest -q tools/tests/test_repository_reasoner_stop_words.py

      - name: Run Engineering Copilot patch integrity regression
        run: node apps/web/tests/engineering-patch-integrity.spec.mjs

      - name: Run full API test suite
        run: npm test --workspace apps/api -- --runInBand

      - name: Build API
        run: npm run build --workspace apps/api

      - name: Build Web
        run: npm run build --workspace apps/web
