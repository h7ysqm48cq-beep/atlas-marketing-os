name: Verify Engineering Copilot Patch Integrity

# Branch-only verification; this workflow never deploys.
on:
  push:
    branches:
      - fix/engineering-copilot-patch-integrity-20260902
    paths:
      - "apps/api/prisma/**"
      - "apps/api/src/engineering/**"
      - "apps/web/src/components/engineering/**"
      - "apps/web/tests/engineering-patch-integrity.spec.mjs"
      - "tools/ai_engineer/**"
      - "tools/tests/test_repository_reasoner_stop_words.py"
      - ".github/workflows/verify-engineering-copilot-patch-integrity.yml"

permissions:
  contents: write

jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:unused@127.0.0.1:59999/unused

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply persisted patch action type fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("apps/api/src/engineering/patch/patch-proposal.service.ts")
          source = path.read_text()
          old = "  action: EngineeringPatchAction;"
          new = '  action: "create" | "modify";'
          if source.count(old) != 1:
              if source.count(new) == 1:
                  raise SystemExit(0)
              raise SystemExit("persisted patch action type target did not match uniquely")
          path.write_text(source.replace(old, new, 1))
          PY
          if git diff --quiet -- apps/api/src/engineering/patch/patch-proposal.service.ts; then
            exit 0
          fi
          git diff --check
          git config user.name "atlas-engineering-ci"
          git config user.email "atlas-engineering-ci@users.noreply.github.com"
          git add apps/api/src/engineering/patch/patch-proposal.service.ts
          git commit -m "fix(engineering): narrow persisted patch actions"
          git push origin HEAD:fix/engineering-copilot-patch-integrity-20260902

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Install Python test dependency
        run: python -m pip install pytest

      - name: Generate Prisma client
        run: npx prisma generate --config prisma.config.ts

      - name: Run repository scanner regression
        run: >-
          npm test --workspace apps/api --
          --runInBand
          --runTestsByPath
          src/engineering/repository/repository.scanner.spec.ts

      - name: Run patch no-op regression
        run: >-
          npm test --workspace apps/api --
          --runInBand
          --runTestsByPath
          src/engineering/patch/patch.service.integrity.spec.ts

      - name: Run persisted proposal contract regression
        run: >-
          npm test --workspace apps/api --
          --runInBand
          --runTestsByPath
          src/engineering/patch/patch-proposal.contract.spec.ts

      - name: Run patch proposal integrity regressions
        run: >-
          npm test --workspace apps/api --
          --runInBand
          --runTestsByPath
          src/engineering/patch/patch-proposal.service.spec.ts

      - name: Run apply proposal integrity regression
        run: >-
          npm test --workspace apps/api --
          --runInBand
          --runTestsByPath
          src/engineering/apply/apply.service.integrity.spec.ts

      - name: Run repository reasoner regressions
        run: python -m pytest -q tools/tests/test_repository_reasoner_stop_words.py

      - name: Run Engineering Copilot patch integrity regression
        run: node apps/web/tests/engineering-patch-integrity.spec.mjs

      - name: Run full API test suite
        run: npm test --workspace apps/api -- --runInBand

      - name: Build API
        run: npm run build --workspace apps/api

      - name: Build Web
        run: npm run build --workspace apps/web
