name: Engineering Reasoner Artifact One Shot

on:
  push:
    branches:
      - fix/engineering-copilot-patch-integrity-20260902
    paths:
      - ".github/workflows/engineering-reasoner-artifact-one-shot.yml"

permissions:
  contents: write

jobs:
  apply-exact-replacement:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace exact reasoner artifact guard
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tools/ai_engineer/repository_reasoner.py")
          text = path.read_text(encoding="utf-8")
          marker = "    @staticmethod\n    def _ignored(\n        path: Path,\n    ) -> bool:\n"

          if text.count(marker) != 1:
              raise SystemExit("reasoner _ignored marker mismatch")

          start = text.index(marker)
          old_tail = text[start:].rstrip()
          expected = (
              "    @staticmethod\n"
              "    def _ignored(\n"
              "        path: Path,\n"
              "    ) -> bool:\n"
              "        ignored = {\n"
              "            \".git\",\n"
              "            \".next\",\n"
              "            \".turbo\",\n"
              "            \".atlas\",\n"
              "            \"node_modules\",\n"
              "            \"dist\",\n"
              "            \"build\",\n"
              "            \"coverage\",\n"
              "            \"__pycache__\",\n"
              "        }\n"
              "\n"
              "        return any(\n"
              "            part in ignored\n"
              "            for part in path.parts\n"
              "        )"
          )

          if old_tail != expected:
              raise SystemExit("reasoner _ignored exact tail mismatch")

          replacement = (
              "    @staticmethod\n"
              "    def _ignored(\n"
              "        path: Path,\n"
              "    ) -> bool:\n"
              "        ignored = {\n"
              "            \".git\",\n"
              "            \".next\",\n"
              "            \".turbo\",\n"
              "            \".atlas\",\n"
              "            \".atlas-backups\",\n"
              "            \"node_modules\",\n"
              "            \"dist\",\n"
              "            \"build\",\n"
              "            \"coverage\",\n"
              "            \"__pycache__\",\n"
              "        }\n"
              "\n"
              "        hidden_backup = re.compile(\n"
              "            r\"^\\..+-backup-\\d{8}(?:-\\d{6})?$\"\n"
              "        )\n"
              "\n"
              "        return any(\n"
              "            part in ignored\n"
              "            or hidden_backup.fullmatch(part)\n"
              "            for part in path.parts\n"
              "        )"
          )

          path.write_text(
              text[:start] + replacement + "\n",
              encoding="utf-8",
          )
          PY

          git diff --check
          git config user.name "atlas-integrity-ci"
          git config user.email "atlas-integrity-ci@users.noreply.github.com"
          git add tools/ai_engineer/repository_reasoner.py
          git commit -m "fix(engineering): ignore backup artifacts in reasoner"
          git push origin HEAD:fix/engineering-copilot-patch-integrity-20260902
