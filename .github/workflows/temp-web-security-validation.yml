name: Temporary Web Security Validation

on:
  push:
    branches:
      - fix/security-web-transitives-20260928
    paths:
      - .github/workflows/temp-web-security-validation.yml

permissions:
  contents: read

jobs:
  validate-web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact lockfile
        run: npm ci

      - name: Web production build
        run: npm run build --workspace apps/web

      - name: Require zero Web audit findings
        shell: bash
        run: |
          npm audit --workspace apps/web --json > /tmp/web-audit.json || true
          node <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('/tmp/web-audit.json', 'utf8'));
          const v = audit.metadata?.vulnerabilities ?? {};
          console.log('ATLAS_WEB_AUDIT_SUMMARY', JSON.stringify(v));
          if ((v.total ?? -1) !== 0) throw new Error('web audit is not zero');
          NODE
