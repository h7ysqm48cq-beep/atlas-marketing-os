name: Verify Workspace Calendar API Fix

on:
  pull_request:
    branches:
      - fix/api-publishing-mode-push-20260831
  workflow_dispatch:

jobs:
  verify-api:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --schema apps/api/prisma/schema.prisma

      - name: Focused workspace tests
        run: npm run test --workspace apps/api -- workspace-isolation.spec.ts workspace-scoped-automation.service.spec.ts --runInBand

      - name: Full API tests
        run: npm run test --workspace apps/api -- --runInBand

      - name: API build
        run: npm run build --workspace apps/api
