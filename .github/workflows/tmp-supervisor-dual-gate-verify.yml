name: tmp-supervisor-dual-gate-verify

on:
  push:
    branches:
      - feat/supervisor-dual-gate-20260901

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Focused Supervisor dual-gate tests
        run: npm run test --workspace apps/api -- --runInBand agent-supervisor/gateway/agent-gateway.review-candidate.spec.ts agent-supervisor/gateway/agent-gateway.service.spec.ts agent-supervisor/agent-supervisor.service.spec.ts agent-supervisor/agent-supervisor.controller.spec.ts agent-supervisor/gateway/supervisor-gateway.controller.spec.ts agent-supervisor/persistence/supervisor-persistence.mapper.spec.ts
      - name: Full Supervisor regression
        run: npm run test --workspace apps/api -- --runInBand agent-supervisor
      - name: API production build
        run: npm run build --workspace apps/api
      - name: Verify CI and Owner credentials stay separated
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/atlas-supervisor-gate.yml
          grep -q 'ATLAS_SUPERVISOR_CI_TOKEN' "$workflow"
          if grep -q 'ATLAS_SUPERVISOR_OWNER_TOKEN' "$workflow"; then
            echo 'Owner token must never be available to GitHub CI'
            exit 1
          fi
          if grep -qi 'X-Atlas-Supervisor-Owner-Token' "$workflow"; then
            echo 'Owner authorization header must never be available to GitHub CI'
            exit 1
          fi
          grep -q 'Validate Supervisor review and Owner merge authorization' "$workflow"
          grep -q 'explicitUserAuthorization: false' "$workflow"
      - name: Verify scoped diff and no Prisma migration
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin production/atlas
          git diff --check origin/production/atlas...HEAD
          changed="$(git diff --name-only origin/production/atlas...HEAD)"
          if printf '%s\n' "$changed" | grep -Eq '(^|/)prisma/|(^|/)prisma\.config\.'; then
            echo 'Unexpected Prisma/schema change in dual-gate hardening'
            printf '%s\n' "$changed"
            exit 1
          fi
