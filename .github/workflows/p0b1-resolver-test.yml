name: p0b1-resolver-test

on:
  push:
    branches:
      - feat/production-deployment-receipt-resolver-20260902

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply P0B-1 source changes
        run: |
          awk '/^diff --git a\/apps\/api\/src\/agent-supervisor\/persistence\/supervisor-persistence.mapper.ts/{exit} {print}' \
            .atlas/p0b1-source.patch > /tmp/p0b1-source-without-mapper.patch
          git apply --check --recount /tmp/p0b1-source-without-mapper.patch
          git apply --recount /tmp/p0b1-source-without-mapper.patch
          python <<'PY'
          from pathlib import Path
          path = Path('apps/api/src/agent-supervisor/persistence/supervisor-persistence.mapper.ts')
          text = path.read_text()
          replacements = [
              ("import type {\n  SupervisorAction,", "import type {\n  ProductionDeploymentService,\n  SupervisorAction,"),
              ("const FULL_SIGNATURE = /^[0-9a-f]{64}$/i;", "const FULL_SIGNATURE = /^[0-9a-f]{64}$/i;\nconst PRODUCTION_DEPLOYMENT_SERVICES = new Set<ProductionDeploymentService>([\n  'api',\n  'web',\n  'browser-worker',\n]);"),
              ("  const candidate = mapReviewCandidate(object.candidate);\n  const authorizedBy = requireString(object.authorizedBy);", "  const candidate = mapReviewCandidate(object.candidate);\n  const service = requireString(object.service) as ProductionDeploymentService;\n  const authorizedBy = requireString(object.authorizedBy);"),
              ("    candidate.targetBranch !== 'production/atlas' ||\n    !authorizedBy.trim() ||", "    candidate.targetBranch !== 'production/atlas' ||\n    !PRODUCTION_DEPLOYMENT_SERVICES.has(service) ||\n    !authorizedBy.trim() ||"),
              ("  return { candidate, authorizedBy, authorizedAt, signature };", "  return { candidate, service, authorizedBy, authorizedAt, signature };"),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one mapper match, got {count}: {old!r}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Adapt existing Supervisor tests to service-bound contract
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          def replace(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} matches, got {count}: {old!r}')
              p.write_text(text.replace(old, new))

          service_spec = 'apps/api/src/agent-supervisor/agent-supervisor.service.spec.ts'
          replace(
              service_spec,
              "import type { SupervisorReviewCandidate } from './agent-supervisor.types';",
              "import type {\n  ProductionDeploymentService,\n  SupervisorReviewCandidate,\n} from './agent-supervisor.types';",
          )
          replace(
              service_spec,
              "interface OwnerDeploymentAuthorizationContract {\n  candidate: SupervisorReviewCandidate;\n  authorizedBy: string;",
              "interface OwnerDeploymentAuthorizationContract {\n  candidate: SupervisorReviewCandidate;\n  service: ProductionDeploymentService;\n  authorizedBy: string;",
          )
          replace(
              service_spec,
              "    candidate: SupervisorReviewCandidate,\n    authorizedBy: string,\n  ) => Promise<unknown>;\n  assertOwnerDeploymentAuthorization?: (\n    task: unknown,\n    candidate: SupervisorReviewCandidate,\n  ) => void;",
              "    candidate: SupervisorReviewCandidate,\n    service: ProductionDeploymentService,\n    authorizedBy: string,\n  ) => Promise<unknown>;\n  assertOwnerDeploymentAuthorization?: (\n    task: unknown,\n    candidate: SupervisorReviewCandidate,\n    service: ProductionDeploymentService,\n  ) => void;",
          )
          replace(
              service_spec,
              "  reviewCandidate: SupervisorReviewCandidate,\n) {",
              "  reviewCandidate: SupervisorReviewCandidate,\n  deploymentService: ProductionDeploymentService = 'api',\n) {",
          )
          replace(
              service_spec,
              "    taskId,\n    reviewCandidate,\n    'owner-user-1',",
              "    taskId,\n    reviewCandidate,\n    deploymentService,\n    'owner-user-1',",
          )
          replace(
              service_spec,
              "      candidate: reviewCandidate,\n      authorizedBy: 'owner-user-1',",
              "      candidate: reviewCandidate,\n      service: 'api',\n      authorizedBy: 'owner-user-1',",
          )
          replace(
              service_spec,
              "      candidate: reviewCandidate,\n      authorizedBy: mergeAuthorization.authorizedBy,",
              "      candidate: reviewCandidate,\n      service: 'api',\n      authorizedBy: mergeAuthorization.authorizedBy,",
          )
          p = Path(service_spec)
          text = p.read_text()
          pattern = re.compile(
              r"(contract\.assertOwnerDeploymentAuthorization!\(\n(?P<i>\s+)(?:authorized|deploymentTask),\n(?P=i)reviewCandidate,\n)(?P<c>\s+\),)"
          )
          def add_service(match):
              indent = match.group('i')
              return match.group(1) + indent + "'api',\n" + match.group('c')
          text, count = pattern.subn(add_service, text)
          if count != 3:
              raise SystemExit(f'{service_spec}: expected 3 deployment assertion calls, got {count}')
          p.write_text(text)

          gateway_spec = 'apps/api/src/agent-supervisor/gateway/agent-gateway.service.spec.ts'
          replace(
              gateway_spec,
              "        candidate: typeof reviewCandidate,\n        authorizedBy: string,",
              "        candidate: typeof reviewCandidate,\n        service: 'api' | 'web' | 'browser-worker',\n        authorizedBy: string,",
          )
          replace(
              gateway_spec,
              "      taskId,\n      reviewCandidate,\n      'owner-user-1',",
              "      taskId,\n      reviewCandidate,\n      'api',\n      'owner-user-1',",
          )

          controller_spec = 'apps/api/src/agent-supervisor/agent-supervisor.controller.spec.ts'
          replace(
              controller_spec,
              "          candidate: reviewCandidate,\n          explicitUserAuthorization: true,",
              "          candidate: reviewCandidate,\n          service: 'api',\n          explicitUserAuthorization: true,",
          )
          replace(
              controller_spec,
              "      reviewCandidate,\n      'authenticated-owner-id',",
              "      reviewCandidate,\n      'api',\n      'authenticated-owner-id',",
          )

          mapper_spec = 'apps/api/src/agent-supervisor/persistence/supervisor-persistence.mapper.spec.ts'
          replace(
              mapper_spec,
              "    candidate: deploymentCandidateFixture(),\n    authorizedBy: 'owner-user-1',",
              "    candidate: deploymentCandidateFixture(),\n    service: 'api',\n    authorizedBy: 'owner-user-1',",
          )
          PY
      - name: Focused contract tests
        run: >-
          npm run test --workspace apps/api -- --runInBand
          production-deployment-resolver.spec.ts
          deployment-authorization-service-binding.spec.ts
          production-deployment-authorization-persistence.spec.ts
      - name: Full Supervisor regression
        run: npm run test --workspace apps/api -- --runInBand agent-supervisor
