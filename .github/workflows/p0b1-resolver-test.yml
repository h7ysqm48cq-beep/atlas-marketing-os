name: p0b1-resolver-test

on:
  push:
    branches:
      - feat/production-deployment-receipt-resolver-20260902

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply P0B-1 source changes
        run: |
          awk '/^diff --git a\/apps\/api\/src\/agent-supervisor\/persistence\/supervisor-persistence.mapper.ts/{exit} {print}' \
            .atlas/p0b1-source.patch > /tmp/p0b1-source-without-mapper.patch
          git apply --check --recount /tmp/p0b1-source-without-mapper.patch
          git apply --recount /tmp/p0b1-source-without-mapper.patch
          python <<'PY'
          from pathlib import Path
          path = Path('apps/api/src/agent-supervisor/persistence/supervisor-persistence.mapper.ts')
          text = path.read_text()

          replacements = [
              (
                  "import type {\n  SupervisorAction,",
                  "import type {\n  ProductionDeploymentService,\n  SupervisorAction,",
              ),
              (
                  "const FULL_SIGNATURE = /^[0-9a-f]{64}$/i;",
                  "const FULL_SIGNATURE = /^[0-9a-f]{64}$/i;\n"
                  "const PRODUCTION_DEPLOYMENT_SERVICES = new Set<ProductionDeploymentService>([\n"
                  "  'api',\n  'web',\n  'browser-worker',\n]);",
              ),
              (
                  "  const candidate = mapReviewCandidate(object.candidate);\n"
                  "  const authorizedBy = requireString(object.authorizedBy);",
                  "  const candidate = mapReviewCandidate(object.candidate);\n"
                  "  const service = requireString(object.service) as ProductionDeploymentService;\n"
                  "  const authorizedBy = requireString(object.authorizedBy);",
              ),
              (
                  "    candidate.targetBranch !== 'production/atlas' ||\n"
                  "    !authorizedBy.trim() ||",
                  "    candidate.targetBranch !== 'production/atlas' ||\n"
                  "    !PRODUCTION_DEPLOYMENT_SERVICES.has(service) ||\n"
                  "    !authorizedBy.trim() ||",
              ),
              (
                  "  return { candidate, authorizedBy, authorizedAt, signature };",
                  "  return { candidate, service, authorizedBy, authorizedAt, signature };",
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one mapper match, got {count}: {old!r}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Focused RED/GREEN tests
        run: >-
          npm run test --workspace apps/api -- --runInBand
          production-deployment-resolver.spec.ts
          deployment-authorization-service-binding.spec.ts
          production-deployment-authorization-persistence.spec.ts
