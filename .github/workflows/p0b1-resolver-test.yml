name: p0b1-resolver-test

on:
  push:
    branches:
      - feat/production-deployment-receipt-resolver-20260902

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Resolver endpoint RED proof
        run: |
          SPEC=apps/api/src/agent-supervisor/gateway/supervisor-gateway.controller.spec.ts
          cp "$SPEC" /tmp/supervisor-gateway.controller.spec.ts
          python <<'PY'
          from pathlib import Path
          path = Path('apps/api/src/agent-supervisor/gateway/supervisor-gateway.controller.spec.ts')
          text = path.read_text()
          anchor = "  it('exposes validation only and delegates to the gateway service', async () => {"
          test = """  it('exposes production deployment receipt resolution behind the CI gateway', async () => {
    const decision = {
      allowed: true,
      reason: null,
      taskId: 'ATLAS-DEPLOY-RESOLVE-1',
      executionId: 'ATLAS-DEPLOY-RESOLVE-EXEC-1',
    };
    const resolveProductionDeployment = jest.fn().mockResolvedValue(decision);
    const controller = new SupervisorGatewayController({
      resolveProductionDeployment,
    } as unknown as AgentGatewayService) as unknown as {
      resolveProductionDeployment?: (input: unknown) => Promise<unknown>;
    };
    const input = {
      service: 'api',
      github: {
        repositoryOwner: 'h7ysqm48cq-beep',
        repositoryName: 'atlas-marketing-os',
        branch: 'production/atlas',
        commitSha: 'a'.repeat(40),
      },
    };

    expect(
      Reflect.getMetadata(GUARDS_METADATA, SupervisorGatewayController),
    ).toContain(SupervisorCiGuard);
    expect(typeof controller.resolveProductionDeployment).toBe('function');
    await expect(controller.resolveProductionDeployment!(input)).resolves.toBe(
      decision,
    );
    expect(resolveProductionDeployment).toHaveBeenCalledWith(input);
  });

"""
          if text.count(anchor) != 1:
              raise SystemExit('controller RED anchor drift')
          path.write_text(text.replace(anchor, test + anchor, 1))
          PY
          set +e
          npm run test --workspace apps/api -- --runInBand supervisor-gateway.controller.spec.ts > /tmp/controller-red.log 2>&1
          status=$?
          set -e
          cat /tmp/controller-red.log
          if [ "$status" -eq 0 ]; then
            echo 'Expected controller resolver contract to be RED before implementation'
            exit 1
          fi
          grep -q 'resolveProductionDeployment' /tmp/controller-red.log
          mv /tmp/supervisor-gateway.controller.spec.ts "$SPEC"

      - name: Apply P0B-1 source changes
        run: |
          awk '/^diff --git a\/apps\/api\/src\/agent-supervisor\/persistence\/supervisor-persistence.mapper.ts/{exit} {print}' \
            .atlas/p0b1-source.patch > /tmp/p0b1-source-without-mapper.patch
          git apply --check --recount /tmp/p0b1-source-without-mapper.patch
          git apply --recount /tmp/p0b1-source-without-mapper.patch
          python <<'PY'
          from pathlib import Path
          path = Path('apps/api/src/agent-supervisor/persistence/supervisor-persistence.mapper.ts')
          text = path.read_text()
          replacements = [
              ("import type {\n  SupervisorAction,", "import type {\n  ProductionDeploymentService,\n  SupervisorAction,"),
              ("const FULL_SIGNATURE = /^[0-9a-f]{64}$/i;", "const FULL_SIGNATURE = /^[0-9a-f]{64}$/i;\nconst PRODUCTION_DEPLOYMENT_SERVICES = new Set<ProductionDeploymentService>([\n  'api',\n  'web',\n  'browser-worker',\n]);"),
              ("  const candidate = mapReviewCandidate(object.candidate);\n  const authorizedBy = requireString(object.authorizedBy);", "  const candidate = mapReviewCandidate(object.candidate);\n  const service = requireString(object.service) as ProductionDeploymentService;\n  const authorizedBy = requireString(object.authorizedBy);"),
              ("    candidate.targetBranch !== 'production/atlas' ||\n    !authorizedBy.trim() ||", "    candidate.targetBranch !== 'production/atlas' ||\n    !PRODUCTION_DEPLOYMENT_SERVICES.has(service) ||\n    !authorizedBy.trim() ||"),
              ("  return { candidate, authorizedBy, authorizedAt, signature };", "  return { candidate, service, authorizedBy, authorizedAt, signature };"),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one mapper match, got {count}: {old!r}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Adapt Supervisor tests to service-bound contract and resolver endpoint
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          def replace(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} matches, got {count}: {old!r}')
              p.write_text(text.replace(old, new))

          service_spec = 'apps/api/src/agent-supervisor/agent-supervisor.service.spec.ts'
          replace(service_spec, "import type { SupervisorReviewCandidate } from './agent-supervisor.types';", "import type {\n  ProductionDeploymentService,\n  SupervisorReviewCandidate,\n} from './agent-supervisor.types';")
          replace(service_spec, "interface OwnerDeploymentAuthorizationContract {\n  candidate: SupervisorReviewCandidate;\n  authorizedBy: string;", "interface OwnerDeploymentAuthorizationContract {\n  candidate: SupervisorReviewCandidate;\n  service: ProductionDeploymentService;\n  authorizedBy: string;")
          replace(service_spec, "    candidate: SupervisorReviewCandidate,\n    authorizedBy: string,\n  ) => Promise<unknown>;\n  assertOwnerDeploymentAuthorization?: (\n    task: unknown,\n    candidate: SupervisorReviewCandidate,\n  ) => void;", "    candidate: SupervisorReviewCandidate,\n    service: ProductionDeploymentService,\n    authorizedBy: string,\n  ) => Promise<unknown>;\n  assertOwnerDeploymentAuthorization?: (\n    task: unknown,\n    candidate: SupervisorReviewCandidate,\n    service: ProductionDeploymentService,\n  ) => void;")
          replace(service_spec, "  reviewCandidate: SupervisorReviewCandidate,\n) {", "  reviewCandidate: SupervisorReviewCandidate,\n  deploymentService: ProductionDeploymentService = 'api',\n) {")
          replace(service_spec, "    taskId,\n    reviewCandidate,\n    'owner-user-1',", "    taskId,\n    reviewCandidate,\n    deploymentService,\n    'owner-user-1',")
          replace(service_spec, "      candidate: reviewCandidate,\n      authorizedBy: 'owner-user-1',", "      candidate: reviewCandidate,\n      service: 'api',\n      authorizedBy: 'owner-user-1',")
          replace(service_spec, "      candidate: reviewCandidate,\n      authorizedBy: mergeAuthorization.authorizedBy,", "      candidate: reviewCandidate,\n      service: 'api',\n      authorizedBy: mergeAuthorization.authorizedBy,")
          p = Path(service_spec)
          text = p.read_text()
          pattern = re.compile(r"(contract\.assertOwnerDeploymentAuthorization!\(\n(?P<i>\s+)(?:authorized|deploymentTask),\n(?P=i)reviewCandidate,\n)(?P<c>\s+\),)")
          def add_service(match):
              indent = match.group('i')
              return match.group(1) + indent + "'api',\n" + match.group('c')
          text, count = pattern.subn(add_service, text)
          if count != 3:
              raise SystemExit(f'{service_spec}: expected 3 deployment assertion calls, got {count}')
          p.write_text(text)

          gateway_spec = 'apps/api/src/agent-supervisor/gateway/agent-gateway.service.spec.ts'
          replace(gateway_spec, "        candidate: typeof reviewCandidate,\n        authorizedBy: string,", "        candidate: typeof reviewCandidate,\n        service: 'api' | 'web' | 'browser-worker',\n        authorizedBy: string,")
          replace(gateway_spec, "      taskId,\n      reviewCandidate,\n      'owner-user-1',", "      taskId,\n      reviewCandidate,\n      'api',\n      'owner-user-1',")

          controller_spec = 'apps/api/src/agent-supervisor/agent-supervisor.controller.spec.ts'
          replace(controller_spec, "          candidate: reviewCandidate,\n          explicitUserAuthorization: true,", "          candidate: reviewCandidate,\n          service: 'api',\n          explicitUserAuthorization: true,")
          replace(controller_spec, "      reviewCandidate,\n      'authenticated-owner-id',", "      reviewCandidate,\n      'api',\n      'authenticated-owner-id',")

          mapper_spec = 'apps/api/src/agent-supervisor/persistence/supervisor-persistence.mapper.spec.ts'
          replace(mapper_spec, "    candidate: deploymentCandidateFixture(),\n    authorizedBy: 'owner-user-1',", "    candidate: deploymentCandidateFixture(),\n    service: 'api',\n    authorizedBy: 'owner-user-1',")

          gateway_controller_spec = Path('apps/api/src/agent-supervisor/gateway/supervisor-gateway.controller.spec.ts')
          text = gateway_controller_spec.read_text()
          anchor = "  it('exposes validation only and delegates to the gateway service', async () => {"
          test = """  it('exposes production deployment receipt resolution behind the CI gateway', async () => {
    const decision = {
      allowed: true,
      reason: null,
      taskId: 'ATLAS-DEPLOY-RESOLVE-1',
      executionId: 'ATLAS-DEPLOY-RESOLVE-EXEC-1',
    };
    const resolveProductionDeployment = jest.fn().mockResolvedValue(decision);
    const controller = new SupervisorGatewayController({
      resolveProductionDeployment,
    } as unknown as AgentGatewayService) as unknown as {
      resolveProductionDeployment?: (input: unknown) => Promise<unknown>;
    };
    const input = {
      service: 'api',
      github: {
        repositoryOwner: 'h7ysqm48cq-beep',
        repositoryName: 'atlas-marketing-os',
        branch: 'production/atlas',
        commitSha: 'a'.repeat(40),
      },
    };

    expect(
      Reflect.getMetadata(GUARDS_METADATA, SupervisorGatewayController),
    ).toContain(SupervisorCiGuard);
    expect(typeof controller.resolveProductionDeployment).toBe('function');
    await expect(controller.resolveProductionDeployment!(input)).resolves.toBe(
      decision,
    );
    expect(resolveProductionDeployment).toHaveBeenCalledWith(input);
  });

"""
          if text.count(anchor) != 1:
              raise SystemExit('gateway controller endpoint anchor drift')
          gateway_controller_spec.write_text(text.replace(anchor, test + anchor, 1))
          PY

      - name: Focused P0B-1 GREEN
        run: >-
          npm run test --workspace apps/api -- --runInBand
          production-deployment-resolver.spec.ts
          deployment-authorization-service-binding.spec.ts
          production-deployment-authorization-persistence.spec.ts
          supervisor-gateway.controller.spec.ts

      - name: Full Supervisor regression before freeze
        run: npm run test --workspace apps/api -- --runInBand agent-supervisor

      - name: Standard API build before freeze
        env:
          DATABASE_URL: postgresql://atlas:atlas@127.0.0.1:5432/atlas_build
        run: npm run build --workspace apps/api

      - name: Restore generated client and freeze exact implementation tree
        run: |
          git restore --source=HEAD -- apps/api/src/generated
          git clean -fd -- apps/api/src/generated
          rm .atlas/p0b1-source.patch
          rm .github/workflows/p0b1-resolver-test.yml
          git diff --check
          git config user.name 'atlas-supervisor-ci'
          git config user.email 'atlas-supervisor-ci@users.noreply.github.com'
          git add \
            apps/api/src/agent-supervisor/agent-supervisor.types.ts \
            apps/api/src/agent-supervisor/agent-supervisor.service.ts \
            apps/api/src/agent-supervisor/agent-supervisor.controller.ts \
            apps/api/src/agent-supervisor/agent-supervisor.service.spec.ts \
            apps/api/src/agent-supervisor/agent-supervisor.controller.spec.ts \
            apps/api/src/agent-supervisor/gateway/agent-gateway.service.ts \
            apps/api/src/agent-supervisor/gateway/agent-gateway.service.spec.ts \
            apps/api/src/agent-supervisor/gateway/supervisor-gateway.controller.ts \
            apps/api/src/agent-supervisor/gateway/supervisor-gateway.controller.spec.ts \
            apps/api/src/agent-supervisor/persistence/supervisor-persistence.mapper.ts \
            apps/api/src/agent-supervisor/persistence/supervisor-persistence.mapper.spec.ts
          git rm .atlas/p0b1-source.patch .github/workflows/p0b1-resolver-test.yml
          git commit -m 'feat(supervisor): resolve production deployment receipts'
          test -z "$(git status --short)"

      - name: Verify exact committed tree scope
        run: |
          BASE=5e5fd295b229d50bf441f7a2e742d0ed4fa4273d
          cat > /tmp/expected-files <<'EOF'
          apps/api/src/agent-supervisor/agent-supervisor.controller.spec.ts
          apps/api/src/agent-supervisor/agent-supervisor.controller.ts
          apps/api/src/agent-supervisor/agent-supervisor.service.spec.ts
          apps/api/src/agent-supervisor/agent-supervisor.service.ts
          apps/api/src/agent-supervisor/agent-supervisor.types.ts
          apps/api/src/agent-supervisor/deployment/deployment-authorization-service-binding.spec.ts
          apps/api/src/agent-supervisor/gateway/agent-gateway.service.spec.ts
          apps/api/src/agent-supervisor/gateway/agent-gateway.service.ts
          apps/api/src/agent-supervisor/gateway/production-deployment-resolver.spec.ts
          apps/api/src/agent-supervisor/gateway/supervisor-gateway.controller.spec.ts
          apps/api/src/agent-supervisor/gateway/supervisor-gateway.controller.ts
          apps/api/src/agent-supervisor/persistence/production-deployment-authorization-persistence.spec.ts
          apps/api/src/agent-supervisor/persistence/supervisor-persistence.mapper.spec.ts
          apps/api/src/agent-supervisor/persistence/supervisor-persistence.mapper.ts
          EOF
          git diff --name-only "$BASE"...HEAD | sort > /tmp/actual-files
          diff -u /tmp/expected-files /tmp/actual-files
          git diff --check "$BASE"...HEAD
          test -z "$(git status --short)"

      - name: Focused P0B-1 committed-tree verification
        run: >-
          npm run test --workspace apps/api -- --runInBand
          production-deployment-resolver.spec.ts
          deployment-authorization-service-binding.spec.ts
          production-deployment-authorization-persistence.spec.ts
          supervisor-gateway.controller.spec.ts

      - name: Full Supervisor committed-tree regression
        run: npm run test --workspace apps/api -- --runInBand agent-supervisor

      - name: Standard API committed-tree build
        env:
          DATABASE_URL: postgresql://atlas:atlas@127.0.0.1:5432/atlas_build
        run: npm run build --workspace apps/api

      - name: Final hygiene and push feature branch only
        run: |
          git restore --source=HEAD -- apps/api/src/generated
          git clean -fd -- apps/api/src/generated
          git diff --check
          test -z "$(git status --short)"
          git push origin HEAD:refs/heads/feat/production-deployment-receipt-resolver-20260902
