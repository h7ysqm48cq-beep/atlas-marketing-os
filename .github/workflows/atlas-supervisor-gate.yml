name: atlas-supervisor-gate

on:
  pull_request:
    branches:
      - production/atlas
      - main
    types: [opened, synchronize, reopened, edited, ready_for_review, closed]

permissions:
  contents: read
  pull-requests: read

jobs:
  atlas-supervisor-gate:
    name: atlas-supervisor-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Collect pull request change set
        id: changes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TARGET_BRANCH: ${{ github.event.pull_request.base.ref }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const { REPOSITORY, PR_NUMBER, TARGET_BRANCH, GITHUB_TOKEN, GITHUB_OUTPUT } = process.env;
          if (!REPOSITORY || !PR_NUMBER || !TARGET_BRANCH || !GITHUB_TOKEN || !GITHUB_OUTPUT) {
            throw new Error('required GitHub event context is missing');
          }

          async function main() {
            const files = [];
            for (let page = 1; ; page += 1) {
              const response = await fetch(
                `https://api.github.com/repos/${REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100&page=${page}`,
                {
                  headers: {
                    Accept: 'application/vnd.github+json',
                    Authorization: `Bearer ${GITHUB_TOKEN}`,
                    'X-GitHub-Api-Version': '2022-11-28',
                  },
                },
              );
              if (!response.ok) {
                throw new Error(`GitHub changed-files request failed: ${response.status}`);
              }
              const batch = await response.json();
              if (!Array.isArray(batch)) throw new Error('invalid GitHub changed-files response');
              files.push(...batch.map((entry) => entry.filename));
              if (batch.length < 100) break;
            }

            if (files.length === 0) throw new Error('empty pull request change set');
            const governancePath = (path) =>
              path === 'AGENTS.md' ||
              path === '.github/workflows/atlas-supervisor-gate.yml' ||
              path.startsWith('.atlas/agent-control/') ||
              path.startsWith('apps/api/src/agent-supervisor/');
            const needsGate = TARGET_BRANCH === 'production/atlas' || files.some(governancePath);
            const changedFilesB64 = Buffer.from(JSON.stringify(files), 'utf8').toString('base64');

            fs.appendFileSync(GITHUB_OUTPUT, `needs_gate=${needsGate ? 'true' : 'false'}\n`);
            fs.appendFileSync(GITHUB_OUTPUT, `changed_files_b64=${changedFilesB64}\n`);
          }

          main().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Require Supervisor task and execution metadata
        if: steps.changes.outputs.needs_gate == 'true'
        id: metadata
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const body = process.env.PR_BODY ?? '';
          const output = process.env.GITHUB_OUTPUT;
          if (!output) throw new Error('GITHUB_OUTPUT is missing');

          function exactlyOne(label) {
            const pattern = new RegExp(`^${label}:\\s*(\\S+)\\s*$`, 'gmi');
            const matches = [...body.matchAll(pattern)];
            if (matches.length !== 1 || !matches[0][1]) {
              throw new Error(`${label} must appear exactly once in the PR body`);
            }
            return matches[0][1];
          }

          const taskId = exactlyOne('ATLAS-SUPERVISOR-TASK');
          const executionId = exactlyOne('ATLAS-SUPERVISOR-EXECUTION');
          fs.appendFileSync(output, `task_id=${taskId}\n`);
          fs.appendFileSync(output, `execution_id=${executionId}\n`);
          NODE

      - name: Require CI gateway configuration
        if: steps.changes.outputs.needs_gate == 'true'
        env:
          SUPERVISOR_API_URL: ${{ secrets.ATLAS_SUPERVISOR_API_URL }}
          SUPERVISOR_CI_TOKEN: ${{ secrets.ATLAS_SUPERVISOR_CI_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPERVISOR_API_URL"
          test -n "$SUPERVISOR_CI_TOKEN"

      - name: Validate Supervisor review and Owner merge authorization
        if: steps.changes.outputs.needs_gate == 'true' && github.event.action != 'closed'
        env:
          SUPERVISOR_API_URL: ${{ secrets.ATLAS_SUPERVISOR_API_URL }}
          SUPERVISOR_CI_TOKEN: ${{ secrets.ATLAS_SUPERVISOR_CI_TOKEN }}
          TASK_ID: ${{ steps.metadata.outputs.task_id }}
          EXECUTION_ID: ${{ steps.metadata.outputs.execution_id }}
          TARGET_BRANCH: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CHANGED_FILES_B64: ${{ steps.changes.outputs.changed_files_b64 }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const required = ['TASK_ID', 'EXECUTION_ID', 'TARGET_BRANCH', 'BASE_SHA', 'HEAD_SHA', 'CHANGED_FILES_B64'];
          for (const key of required) {
            if (!process.env[key]) throw new Error(`${key} is missing`);
          }
          const changedFiles = JSON.parse(
            Buffer.from(process.env.CHANGED_FILES_B64, 'base64').toString('utf8'),
          );
          if (!Array.isArray(changedFiles) || changedFiles.length === 0) {
            throw new Error('invalid changed file list');
          }
          const payload = {
            taskId: process.env.TASK_ID,
            executionId: process.env.EXECUTION_ID,
            action: 'merge',
            targetBranch: process.env.TARGET_BRANCH,
            baseSha: process.env.BASE_SHA,
            headSha: process.env.HEAD_SHA,
            changedFiles,
            explicitUserAuthorization: false,
          };
          fs.writeFileSync('/tmp/atlas-supervisor-payload.json', JSON.stringify(payload));
          NODE

          url="${SUPERVISOR_API_URL%/}/engineering/supervisor/gateway/review-candidate"
          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --max-time 15 \
            --retry 1 \
            --retry-all-errors \
            --request POST \
            --header 'Content-Type: application/json' \
            --header "X-Atlas-Supervisor-CI-Token: ${SUPERVISOR_CI_TOKEN}" \
            --data-binary @/tmp/atlas-supervisor-payload.json \
            "$url" \
            --output /tmp/atlas-supervisor-response.json

          node <<'NODE'
          const fs = require('node:fs');
          const response = JSON.parse(fs.readFileSync('/tmp/atlas-supervisor-response.json', 'utf8'));
          if (
            response?.allowed !== true ||
            response?.taskId !== process.env.TASK_ID ||
            response?.executionId !== process.env.EXECUTION_ID
          ) {
            throw new Error('ATLAS Supervisor denied or returned a mismatched dual-gate decision');
          }
          console.log('ATLAS Supervisor review and signed Owner merge authorization passed. CI validation does not itself authorize or execute merge.');
          NODE

      - name: Consume trusted GitHub merge attestation
        if: steps.changes.outputs.needs_gate == 'true' && github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'production/atlas'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TASK_ID: ${{ steps.metadata.outputs.task_id }}
          EXECUTION_ID: ${{ steps.metadata.outputs.execution_id }}
          TARGET_BRANCH: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CHANGED_FILES_B64: ${{ steps.changes.outputs.changed_files_b64 }}
          SUPERVISOR_API_URL: ${{ secrets.ATLAS_SUPERVISOR_API_URL }}
          SUPERVISOR_CI_TOKEN: ${{ secrets.ATLAS_SUPERVISOR_CI_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const {
            GITHUB_TOKEN,
            REPOSITORY,
            PR_NUMBER,
            TASK_ID,
            EXECUTION_ID,
            TARGET_BRANCH,
            BASE_SHA,
            HEAD_SHA,
            CHANGED_FILES_B64,
          } = process.env;
          const required = {
            GITHUB_TOKEN,
            REPOSITORY,
            PR_NUMBER,
            TASK_ID,
            EXECUTION_ID,
            TARGET_BRANCH,
            BASE_SHA,
            HEAD_SHA,
            CHANGED_FILES_B64,
          };
          for (const [key, value] of Object.entries(required)) {
            if (!value) throw new Error(`${key} is missing`);
          }

          const headers = {
            Accept: 'application/vnd.github+json',
            Authorization: `Bearer ${GITHUB_TOKEN}`,
            'X-GitHub-Api-Version': '2022-11-28',
          };

          async function github(path) {
            const response = await fetch(`https://api.github.com/repos/${REPOSITORY}${path}`, { headers });
            if (!response.ok) {
              throw new Error(`GitHub merge-attestation request failed: ${response.status}`);
            }
            return response.json();
          }

          async function main() {
            if (TARGET_BRANCH !== 'production/atlas') {
              throw new Error('trusted merge attestation requires production/atlas');
            }

            const pr = await github(`/pulls/${PR_NUMBER}`);
            if (
              pr?.merged !== true ||
              typeof pr?.merged_at !== 'string' ||
              !pr.merged_at ||
              typeof pr?.merge_commit_sha !== 'string' ||
              !pr.merge_commit_sha
            ) {
              throw new Error('GitHub pull request is not a completed merge');
            }
            if (
              pr?.base?.ref !== TARGET_BRANCH ||
              pr?.base?.sha !== BASE_SHA ||
              pr?.head?.sha !== HEAD_SHA
            ) {
              throw new Error('GitHub pull request candidate does not match event candidate');
            }

            const mergeCommit = await github(`/commits/${pr.merge_commit_sha}`);
            if (!Array.isArray(mergeCommit?.parents) || mergeCommit.parents.length !== 2) {
              throw new Error('GitHub merge commit must have exactly two parents');
            }
            if (
              mergeCommit.parents[0]?.sha !== BASE_SHA ||
              mergeCommit.parents[1]?.sha !== HEAD_SHA
            ) {
              throw new Error('GitHub merge commit parents do not match reviewed candidate');
            }

            const changedFiles = JSON.parse(
              Buffer.from(CHANGED_FILES_B64, 'base64').toString('utf8'),
            );
            if (!Array.isArray(changedFiles) || changedFiles.length === 0) {
              throw new Error('invalid changed file list');
            }

            const payload = {
              taskId: TASK_ID,
              executionId: EXECUTION_ID,
              action: 'merge',
              targetBranch: TARGET_BRANCH,
              baseSha: BASE_SHA,
              headSha: HEAD_SHA,
              changedFiles,
              attestation: {
                pullRequestNumber: Number(PR_NUMBER),
                mergeCommitSha: pr.merge_commit_sha,
                mergeParents: [
                  mergeCommit.parents[0].sha,
                  mergeCommit.parents[1].sha,
                ],
                mergedAt: pr.merged_at,
              },
            };
            fs.writeFileSync('/tmp/atlas-supervisor-merge-consumption.json', JSON.stringify(payload));
          }

          main().catch((error) => {
            console.error(error?.message ?? 'trusted merge attestation preparation failed');
            process.exit(1);
          });
          NODE

          url="${SUPERVISOR_API_URL%/}/engineering/supervisor/gateway/merge-authorization/consume"
          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --max-time 15 \
            --request POST \
            --header 'Content-Type: application/json' \
            --header "X-Atlas-Supervisor-CI-Token: ${SUPERVISOR_CI_TOKEN}" \
            --data-binary @/tmp/atlas-supervisor-merge-consumption.json \
            "$url" \
            --output /tmp/atlas-supervisor-merge-consumption-response.json

          node <<'NODE'
          const fs = require('node:fs');
          const response = JSON.parse(
            fs.readFileSync('/tmp/atlas-supervisor-merge-consumption-response.json', 'utf8'),
          );
          if (
            response?.allowed !== true ||
            response?.taskId !== process.env.TASK_ID ||
            response?.executionId !== process.env.EXECUTION_ID
          ) {
            throw new Error('ATLAS Supervisor rejected trusted merge consumption or returned mismatched identity');
          }
          console.log('ATLAS Supervisor trusted GitHub merge attestation consumed.');
          NODE

      - name: Report closed pull request without merge
        if: steps.changes.outputs.needs_gate == 'true' && github.event.action == 'closed' && github.event.pull_request.merged != true
        run: echo 'Pull request closed without merge; no merge authorization consumption performed.'

      - name: Report gate not required for non-governance main change
        if: steps.changes.outputs.needs_gate != 'true'
        run: echo 'ATLAS Supervisor gate not required for this non-governance main pull request.'

  api-verification:
    name: api-verification
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://postgres:unused@127.0.0.1:59999/unused
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --config prisma.config.ts

      - name: Engineering Runner contracts
        run: npm test --workspace apps/engineering-runner

      - name: Engineering Runner build
        run: npm run build --workspace apps/engineering-runner

      - name: Targeted Supervisor tests
        run: npm test --workspace apps/api -- --runInBand verifier-capability.service.spec.ts supervisor-verifier.guard.spec.ts supervisor-verifier.controller.spec.ts agent-gateway.service.spec.ts supervisor-gateway.controller.spec.ts agent-supervisor.service.spec.ts

      - name: API build and regression guards
        run: npm run build --workspace apps/api
