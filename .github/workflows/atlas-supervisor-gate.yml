name: p0b-engineering-runner-lock-blob

on:
  push:
    branches:
      - feat/p0b-engineering-agent-runner-20260914

permissions:
  contents: write

jobs:
  create-lock-blob:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Generate synchronized lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Create unattached package-lock Git blob
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');
          const expected = execFileSync('git', ['hash-object', 'package-lock.json'], { encoding: 'utf8' }).trim();
          const content = fs.readFileSync('package-lock.json').toString('base64');
          async function main() {
            const response = await fetch(`https://api.github.com/repos/${process.env.REPOSITORY}/git/blobs`, {
              method: 'POST',
              headers: {
                Accept: 'application/vnd.github+json',
                Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
                'X-GitHub-Api-Version': '2022-11-28',
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({ content, encoding: 'base64' }),
            });
            if (!response.ok) throw new Error(`blob creation failed:${response.status}`);
            const body = await response.json();
            if (body?.sha !== expected) throw new Error('created blob SHA mismatch');
            console.log(`LOCK_BLOB_SHA=${body.sha}`);
            console.log('BRANCH_REF_UPDATED=false');
            console.log('LOCKFILE_SECRET_CONTENT=NONE');
          }
          main().catch((error) => {
            console.error(error?.message ?? 'lock blob creation failed');
            process.exit(1);
          });
          NODE
