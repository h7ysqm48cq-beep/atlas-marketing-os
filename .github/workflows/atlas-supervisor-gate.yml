name: p0b-engineering-runner-branch-verification

on:
  push:
    branches:
      - feat/p0b-engineering-agent-runner-20260914

permissions:
  contents: read

jobs:
  branch-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://postgres:unused@127.0.0.1:59999/unused
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --config prisma.config.ts

      - name: Engineering Runner contracts
        run: npm test --workspace apps/engineering-runner

      - name: Engineering Runner build
        run: npm run build --workspace apps/engineering-runner

      - name: Targeted Supervisor tests
        run: npm test --workspace apps/api -- --runInBand verifier-capability.service.spec.ts supervisor-verifier.guard.spec.ts supervisor-verifier.controller.spec.ts agent-gateway.service.spec.ts supervisor-gateway.controller.spec.ts agent-supervisor.service.spec.ts

      - name: API build
        run: npm run build --workspace apps/api
