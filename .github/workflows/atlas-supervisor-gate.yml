name: atlas-worker-bootstrap-secret-probe

on:
  push:
    branches:
      - feat/p0b-engineering-agent-runner-20260914

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      SUPERVISOR_API_URL: ${{ secrets.ATLAS_SUPERVISOR_API_URL }}
      WORKER_BOOTSTRAP_TOKEN: ${{ secrets.ATLAS_SUPERVISOR_WORKER_BOOTSTRAP_TOKEN }}
    steps:
      - name: Probe server-side bootstrap secret availability
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPERVISOR_API_URL"
          if [ -z "${WORKER_BOOTSTRAP_TOKEN:-}" ]; then
            echo "BOOTSTRAP_SECRET_PRESENT=false"
            echo "SECRET_PRINTED=false"
            echo "CLAIM_NEXT_CALLED=false"
            exit 3
          fi
          echo "BOOTSTRAP_SECRET_PRESENT=true"
          echo "SECRET_PRINTED=false"
          echo "CLAIM_NEXT_CALLED=false"
