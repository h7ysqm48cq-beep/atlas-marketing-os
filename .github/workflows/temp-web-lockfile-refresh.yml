name: Temporary Web Lockfile Security Refresh

on:
  push:
    branches:
      - fix/security-web-transitives-20260928
    paths:
      - .github/workflows/temp-web-lockfile-refresh.yml

permissions:
  contents: write

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/security-web-transitives-20260928

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Refresh only affected transitive packages
        run: npm update brace-expansion nanoid --package-lock-only --ignore-scripts

      - name: Verify generated scope and Web audit
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          test "$changed" = "package-lock.json"

          node <<'NODE'
          const lock = require('./package-lock.json');
          const p = lock.packages || {};
          const expected = new Map([
            ['node_modules/brace-expansion', '1.1.21'],
            ['node_modules/filelist/node_modules/brace-expansion', '2.1.7'],
            ['node_modules/@typescript-eslint/typescript-estree/node_modules/brace-expansion', '5.0.12'],
            ['node_modules/glob/node_modules/brace-expansion', '5.0.12'],
            ['node_modules/nanoid', '3.3.19'],
          ]);
          for (const [path, version] of expected) {
            if (p[path]?.version !== version) {
              throw new Error(`unexpected ${path} version: ${p[path]?.version}`);
            }
          }
          console.log('ATLAS_SECURITY_TARGETS_VERIFIED');
          NODE

          npm audit --workspace apps/web --json > /tmp/web-audit.json || true
          node <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('/tmp/web-audit.json', 'utf8'));
          const v = audit.metadata?.vulnerabilities ?? {};
          console.log('ATLAS_WEB_AUDIT_SUMMARY', JSON.stringify(v));
          if ((v.total ?? -1) !== 0) {
            throw new Error('web audit is not zero');
          }
          NODE

      - name: Commit generated lockfile to temporary branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix(web): refresh vulnerable transitive lockfile entries"
          git push origin HEAD:fix/security-web-transitives-20260928
