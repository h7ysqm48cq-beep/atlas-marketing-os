name: Engineering Proposal Schema One Shot

on:
  push:
    branches:
      - fix/engineering-copilot-patch-integrity-20260902
    paths:
      - ".github/workflows/engineering-proposal-schema-one-shot.yml"

permissions:
  contents: write

jobs:
  append-proposal-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Append exact proposal schema
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("apps/api/prisma/schema.prisma")
          text = path.read_text(encoding="utf-8")

          if "model EngineeringPatchProposal" in text:
              raise SystemExit("EngineeringPatchProposal already exists")
          if "enum EngineeringPatchProposalStatus" in text:
              raise SystemExit("EngineeringPatchProposalStatus already exists")

          block = '''

          enum EngineeringPatchProposalStatus {
            DRAFT
            READY_FOR_REVIEW
            APPROVED
            APPLIED
            REJECTED
            STALE
          }

          model EngineeringPatchProposal {
            id               String                          @id @default(cuid())
            request          String
            status           EngineeringPatchProposalStatus @default(READY_FOR_REVIEW)
            revision         Int                             @default(1)
            snapshotHash     String
            patches          Json
            createdByUserId  String
            approvedByUserId String?
            rejectedByUserId String?
            appliedByUserId  String?
            createdAt        DateTime                        @default(now())
            updatedAt        DateTime                        @updatedAt
            approvedAt       DateTime?
            rejectedAt       DateTime?
            appliedAt        DateTime?
            staleAt          DateTime?

            @@index([status, createdAt])
            @@index([createdByUserId, createdAt])
            @@index([snapshotHash])
          }
          '''

          path.write_text(
              text.rstrip() + block.rstrip() + "\n",
              encoding="utf-8",
          )
          PY

          git diff --check
          git config user.name "atlas-integrity-ci"
          git config user.email "atlas-integrity-ci@users.noreply.github.com"
          git add apps/api/prisma/schema.prisma
          git commit -m "feat(engineering): add patch proposal schema"
          git push origin HEAD:fix/engineering-copilot-patch-integrity-20260902
