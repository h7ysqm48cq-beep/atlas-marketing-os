name: tmp-supervisor-exact-candidate-verify

on:
  push:
    branches:
      - feat/supervisor-exact-candidate-binding-20260901

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema apps/api/prisma/schema.prisma
      - run: npm run test --workspace apps/api -- agent-supervisor/gateway/agent-gateway.review-candidate.spec.ts --runInBand
