name: Emergency API Image

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/emergency-api-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout fixed API branch
        uses: actions/checkout@v4
        with:
          ref: agent/railway-sync

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build emergency API image
        run: |
          docker build \
            --platform linux/amd64 \
            -f Dockerfile.api.recovery \
            -t ghcr.io/h7ysqm48cq-beep/atlas-marketing-os-api-recovery:emergency \
            .

      - name: Push emergency API image
        run: |
          docker push ghcr.io/h7ysqm48cq-beep/atlas-marketing-os-api-recovery:emergency

      - name: Record image
        run: |
          echo "Emergency image: ghcr.io/h7ysqm48cq-beep/atlas-marketing-os-api-recovery:emergency" >> "$GITHUB_STEP_SUMMARY"
